# _config.yml — Unio Analytics

theme: null

title: Unio Analytics
description: A sourced record of AI-enabled crime, and what happened next.
url: "https://unio-analytics.com"
baseurl: ""

author:
  name: Jason Ahn
  email: jason@unio-analytics.com

markdown: kramdown
plugins:
  - jekyll-sitemap
  - jekyll-feed

collections:
  entries:
    output: true
    permalink: /entry/:name/

defaults:
  - scope:
      path: ""
      type: "entries"
    values:
      layout: "entry"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules