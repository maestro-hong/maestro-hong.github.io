- key: court
  name: Court record
  name_ko: 법원 기록
  blurb: A charging document, plea or judgment states what the AI did.
  blurb_ko: 기소장, 유죄 인정 또는 판결문이 AI가 한 일을 적시합니다.
- key: described
  name: Method described
  name_ko: 방법 설명
  blurb: An agency or a party to the incident describes what the AI did, but no court record does.
  blurb_ko: 수사기관이나 사건 당사자가 AI가 한 일을 설명하지만, 법원 기록에는 없습니다.
- key: statement
  name: Official statement only
  name_ko: 공식 발언만
  blurb: An official says AI was used without saying how.
  blurb_ko: 공식 발표나 발언이 AI를 썼다고만 하고 어떻게 썼는지는 밝히지 않습니다.
- key: media
  name: Media only
  name_ko: 언론 보도만
  blurb: Only news reports claim AI was used.
  blurb_ko: 언론 보도만 AI 사용을 주장합니다.
- key: none
  name: Not claimed
  name_ko: 주장 없음
  blurb: No source claims AI was used to commit the offence.
  blurb_ko: 범행에 AI를 썼다고 주장하는 출처가 없습니다.
