- key: identity-check
  name: Identity check
  name_ko: 신원 확인
  blurb: An ID document, selfie, liveness test or other identity verification.
  blurb_ko: 신분증, 셀피, 생체 인증 등 신원 확인 절차.
- key: voice-video-check
  name: Voice or video check
  name_ko: 음성·영상 확인
  blurb: A callback, voice recognition or video call used to confirm who is asking.
  blurb_ko: 콜백, 음성 인식, 영상 통화 등으로 요청한 사람이 누구인지 확인하는 절차.
- key: payment-control
  name: Payment control
  name_ko: 결제·이체 통제
  blurb: Transfer limits, transaction monitoring or payment holds.
  blurb_ko: 이체 한도, 거래 모니터링, 지급 보류 등 금융 거래 통제.
- key: platform-detection
  name: Platform detection
  name_ko: 플랫폼 탐지
  blurb: A platform's or service's own abuse and fraud detection.
  blurb_ko: 온라인 플랫폼이나 서비스가 스스로 부정 사용을 찾아내는 체계.
- key: staff-procedure
  name: Staff procedure
  name_ko: 직원 절차
  blurb: Checks carried out by front-line staff, such as store pickup or help-desk verification.
  blurb_ko: 매장 수령 확인이나 고객센터 본인 확인처럼 현장 직원이 수행하는 절차.
- key: account-security
  name: Account security
  name_ko: 계정 보안
  blurb: Passwords, multi-factor authentication and other access controls on accounts.
  blurb_ko: 비밀번호, 다중 인증 등 계정 접근 통제.
- key: system-isolation
  name: System isolation
  name_ko: 시스템 격리
  blurb: Sandboxes, network isolation and allowlists that keep systems apart.
  blurb_ko: 샌드박스, 네트워크 격리, 허용 목록 등 시스템을 서로 분리하는 통제.
- key: due-diligence
  name: Due diligence
  name_ko: 실사·감사
  blurb: Audits, investor due diligence and lending checks.
  blurb_ko: 회계 감사, 투자 실사, 대출 심사.
- key: provider-safeguards
  name: AI provider safeguards
  name_ko: AI 제공자 안전장치
  blurb: An AI provider's refusals, abuse detection and referrals to police.
  blurb_ko: AI 서비스 제공자의 요청 거부, 오남용 탐지, 수사기관 통보.
- key: unknown
  name: Not stated
  name_ko: 알 수 없음
  blurb: No source identifies the safeguard involved.
  blurb_ko: 어떤 안전장치가 관련됐는지 밝힌 출처가 없습니다.
