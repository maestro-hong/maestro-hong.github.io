- name: TAKE IT DOWN Act
  jurisdiction: United States (federal)
  enacted: 2025
  ai_specific: true
  scope: Non-consensual intimate imagery and digital forgeries of identifiable people.
  convictions: "1"
  detail: >
    One conviction located. A guilty plea in April 2026 led to a 180-month
    sentence in September 2026. The forgery count reached the adult victims; the
    child-related conduct in the same case was charged under a statute from 2003.
  entry: /entry/strahler-ai-conviction/

- name: AI Basic Act
  jurisdiction: South Korea
  enacted: 2026
  ai_specific: true
  scope: Governance, transparency and risk obligations on developers and deployers.
  convictions: "n/a"
  detail: >
    Regulatory rather than criminal, in force since January 2026. No enforcement
    action located. Included because it is frequently cited as evidence that a
    jurisdiction is acting on AI crime, which it is not designed to do.

- name: State AI election deepfake laws
  jurisdiction: United States (multiple states)
  enacted: 2019–2026
  ai_specific: true
  scope: Synthetic media depicting candidates, typically within a window before an election.
  convictions: "0"
  detail: >
    No criminal conviction located in any state. The most prominent prosecution,
    of the consultant behind a 2024 robocall imitating President Biden, ended in
    acquittal in June 2025 (<a href="https://www.nhpr.org/nh-news/2025-06-13/political-operative-fake-biden-robocalls-nh-primary-found-not-guilty">NHPR</a>);
    a separate $6 million FCC fine was regulatory, not criminal
    (<a href="https://www.fcc.gov/document/fcc-issues-6m-fine-nh-robocalls">FCC</a>).
    Federal courts struck down California's law in August 2025
    (<a href="https://news.bloomberglaw.com/litigation/musk-challenged-california-anti-deepfake-law-struck-by-judge">Bloomberg Law</a>)
    and Hawaii's in January 2026
    (<a href="https://reason.com/volokh/2026/01/31/hawaii-deceptive-election-related-deepfake-disclaimer-requirement-struck-down">Reason</a>).
    In September 2026 a federal judge found Montana's law likely unconstitutional
    in a ruling limited to the plaintiffs; the law remains in force
    (<a href="https://dailymontanan.com/2026/09/18/federal-judge-says-ai-deepfake-election-law-violates-first-amendment/">Daily Montanan</a>).

- name: Act on Special Cases Concerning the Punishment of Sexual Crimes
  jurisdiction: South Korea
  enacted: 1994, deepfake provisions amended 2020 and 2024
  ai_specific: partial
  scope: Production and distribution of sexually explicit synthetic media.
  convictions: "high volume (arrests)"
  detail: >
    In a national crackdown from November 2024 to October 2025,
    fabricated sexual imagery was the largest category of cybersexual crime:
    1,553 of 4,413 recorded cases. Counting deepfake-made child sexual
    exploitation material as well, police acted on 1,462 deepfake cases and
    arrested 1,438 people, 62% of them teenagers. These are arrest figures;
    conviction totals were not located. No other jurisdiction in this list is
    enforcing at comparable volume
    (<a href="https://www.newsis.com/view/NISX20251114_0003403877">Newsis</a>,
    reporting Korean National Police Agency figures, November 16, 2025).

- name: EU AI Act
  jurisdiction: European Union
  enacted: 2024
  ai_specific: true
  scope: Prohibited practices and risk tiers for AI systems.
  convictions: "n/a"
  detail: >
    Regulatory, phased, and enforced against providers and deployers rather than
    offenders. Criminal enforcement remains a member-state matter. No criminal
    prosecution located under national implementing provisions.

- name: 18 U.S.C. § 1343 (wire fraud)
  jurisdiction: United States (federal)
  enacted: 1952
  ai_specific: false
  scope: Schemes to defraud using interstate wire communications.
  convictions: "in use"
  detail: >
    Predates the internet. Carried the largest AI-enabled fraud conviction located
    to date: a guilty plea in March 2026 over hundreds of thousands of AI-generated
    songs streamed by bot accounts, with $8,091,843.64 forfeited. No AI-specific
    statute was needed or used.
  entry: /entry/ai-song-crackdown/

- name: 18 U.S.C. § 1466A
  jurisdiction: United States (federal)
  enacted: 2003
  ai_specific: false
  scope: Obscene visual representations of the sexual abuse of children.
  convictions: "in use"
  detail: >
    Two decades older than generative AI and expressly carved out of the TAKE IT
    DOWN Act's intimate-depiction offence. It, not the newer statute, reached the
    child-related conduct in the first TAKE IT DOWN Act case.
  entry: /entry/strahler-ai-conviction/

- name: C.R.S. § 18-6-403 (Colorado)
  jurisdiction: United States (Colorado)
  enacted: pre-dates generative AI
  ai_specific: false
  scope: Sexual exploitation of a child, including production and possession.
  convictions: "charged"
  detail: >
    Twenty-three counts brought in January 2026 over images said to have been
    produced by altering photographs of real children with generative tools. There are no federal counts. 
    No disposition located.
  entry: /entry/72-year-old-man-charged-ai-child-image/

- name: 720 ILCS 5/11-20.4 (Illinois)
  jurisdiction: United States (Illinois)
  enacted: 2024, in force January 2025
  ai_specific: true
  scope: Obscene depictions of a purported child, including computer-generated images and video.
  convictions: "charged"
  detail: >
    Thirteen counts approved in October 2026 against an Antioch man, with more
    charges expected. No disposition located.
  entry: /entry/antioch-man-child-abuse-material-arrested/

- name: Fla. Stat. § 827.072 (Florida)
  jurisdiction: United States (Florida)
  enacted: 2024
  ai_specific: true
  scope: Generated sexual images of a fictitious person who appears to be a minor.
  convictions: "charged"
  detail: >
    Two Martin County cases located, from February 2025 and September 2026. No
    disposition located in either.
  entry: /entry/stuart-generated-charge/