{% include pool.html %}
{% assign all = pool %}
<div class="wrap controls">

  <nav class="controls__group controls__group--cat" aria-label="{{ t.category }}">
    <a class="controls__item{% if include.active == nil %} is-on{% endif %}"{% if include.active == nil %} aria-current="page"{% endif %} href="{% if lang == "ko" %}/ko/{% else %}/entries/{% endif %}"><span>{{ t.all }} {{ all.size }}</span></a>
    {%- for c in site.data.categories -%}
    {%- assign n = all | where: "category", c.key -%}
    {%- if n.size > 0 or include.active == c.slug %}
    <a class="controls__item{% if include.active == c.slug %} is-on{% endif %}"{% if include.active == c.slug %} aria-current="page"{% endif %} href="{{ base }}/category/{{ c.slug }}/"><span>{{ c[nk] | default: c.name }} {{ n.size }}</span></a>
    {%- endif -%}
    {%- endfor %}
  </nav>

  <div class="controls__group controls__group--sort" role="group" aria-label="{{ t.sort }}">
    <button type="button" class="controls__item is-on" data-sort="date" data-dir="desc" aria-pressed="true"><span>{{ t.date | default: "Date" }}<i class="controls__arrow" aria-hidden="true"> &darr;</i></span></button>
    <button type="button" class="controls__item" data-sort="country" data-dir="asc" aria-pressed="false"><span>{{ t.country }}<i class="controls__arrow" aria-hidden="true"></i></span></button>
    <button type="button" class="controls__item" data-sort="status" data-dir="asc" aria-pressed="false"><span>{{ t.status }}<i class="controls__arrow" aria-hidden="true"></i></span></button>
  </div>

</div>
